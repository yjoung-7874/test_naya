<!doctype html>
<!--문서가 html임을 지시-->
<html lang="en">
	<!--언어를 영어로 설정-->

	<head>
		<!--메타데이터 정의-->
		<title>Create Your Own Chatbot</title>
		<!--페이지 제목-->
		<meta charset="UTF-8" />
		<!--인코딩 방식을 설정-->
		<meta name="viewport" content="width=device-width" />
		<!--뷰포트 너비를 기기 폭에 맞춤-->
		<link rel="stylesheet" href="styles.css" />
		<!--외부 스타일 CSS파일을 stylesheet로 설정하여 문서에 적용될 스타일임을 알림-->
		<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700,300" />
		<!--폰트를 불러옴-->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/material-design-iconic-font/2.1.2/css/material-design-iconic-font.min.css"
		/>
		<!--아이콘 폰트를 불러옴-->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400&family=Finger+Paint&display=swap"
		/>
		<!--폰트를 불러옴-->
		<style>
			/* 문서의 스타일 정의 */
			a {
				/* a태그 전체에 적용할 스타일 정의 */
				color: inherit; /* 색깔은 부모 요소에서 물려받고 */
				text-decoration: underline; /* 글자는 밑줄을 친다 */
				font-size: inherit; /* 폰트 크기도 부모 요소에서 물려받기 */
			}

			a:hover {
				/* a태그에 호버 시 */
				opacity: 0.7; /* 불투명도가 0.7이 된다 */
			}
		</style>
	</head>

	<body>
		<!--몸체 시작-->
		<div class="botbody">
			<!--레이아웃 구성, CSS의 botbody 클래스 적용-->
			<div class="botcontent">
				<!--서브레이아웃 구성, CSS의 botcontent 클래스 적용-->
				<div class="card">
					<!--서브레이아웃 구성, CSS의 card 클래스 적용-->
					<div id="botheader">
						<!--서브레이아웃 구성, botheader id 설정-->
						<h1>Chatter box!</h1>
						<!--제목을 크게 작성-->
						<button class="send" onclick="reset()">
							<!--CSS의 send 클래스 적용, 클릭 시 JS의 reset()함수 실행-->
							<div class="circle refresh">
								<!--서브레이아웃 구성(새로고침 동그라미), CSS의 circle refresh 클래스 적용-->
								<i class="zmdi zmdi-refresh-sync" style="font-size: 1.5rem; margin-left: 0.2rem"></i>
								<!--기본 텍스트와는 다른 텍스트 정의->아이콘, 앞서 불러온 아이콘에서 새로고침 아이콘 적용, 
                                inline CSS로 글자 크기와 왼쪽 여백을 정의-->
							</div>
						</button>
					</div>
					<hr />
					<!--구분선-->
					<div id="message-section">
						<!--서브레이아웃 구성(채팅창), id 설정-->
						<!-- Chat messages will be displayed here -->
						<div class="message" id="bot"><span id="bot-response">Hello.. I'm listening! Go on..</span></div>
						<!--서브레이아웃, CSS는 message 클래스 적용, id는 bot. span으로 봇이 보내는 텍스트 메시지를 만듦, id 설정-->
					</div>
					<div class="quickbtns">
						<!--서브레이아웃, CSS 클래스 적용, 지정 질문 버튼 칸-->
						<button
							tabindex="2"
							class="quickmessage"
							data-message="Check USN 📝"
							onclick="send(this.getAttribute('data-message'))"
						>
							<!--* 탭을 2번 눌렀을 때 선택되게 함? , CSS 클래스 적용,
                        정보를 저장할 메시지 설정, 클릭 시 실행할 함수 설정(send는 어디?)-->
							Check USN 📝<!--표시할 메시지-->
						</button>
						<button
							tabindex="1"
							class="quickmessage"
							data-message="Report a Bug 🐞"
							onclick="send(this.getAttribute('data-message'))"
						>
							<!-- * 탭을 1번 눌렀을 때 선택되게 함? , 나머지는 위와 같음-->
							Report a Bug 🐞
							<!--표시할 메시지-->
						</button>
					</div>
					<div id="input-section">
						<!--서브레이아웃(입력창), id 설정-->
						<input
							id="user-input"
							type="text"
							placeholder="Type a message..."
							autocomplete="on"
							autofocus="autofocus"
							tabindex="3"
						/>
						<!--id 설정, 텍스트 인풋, 기본 텍스트 설정, 입력 추천 on,
                        페이지 로드 시 자동으로 입력창으로 포커스 이동, * 탭을 3번 눌렀을 때 선택??-->
						<button type="submit" class="send sendmessage" onclick="sendMessage()" tabindex="3">
							<!--버튼(전송) 생성, 페이지에 작성된 내용을 전송, CSS 클래스 적용,
                            클릭 시 JS 함수 적용, * 탭을 3번 눌렀을 때 선택???-->
							<div class="circle">
								<!--버튼의 영역을 정하는 서브 레이아웃, CSS 클래스 적용-->
								<i class="zmdi zmdi-mail-send" style="font-size: 1.5rem; margin-left: 0.2rem"></i>
								<!--아이콘 생성, 앞서 불러온 아이콘에서 보내기 아이콘을 클래스로 가져옴, 글자 크기와 왼쪽 여백 설정-->
							</div>
						</button>
					</div>
				</div>
			</div>
		</div>
		<script>
			// * 자바스크립트 코드 시작: script.js가 있는데 왜 거기에 다 넣지 않고??
			function reset() {
				// reset 함수 정의
				document.getElementById('message-section').innerHTML =
					'<div class="message" id="bot"><span id="bot-response">Hello.. I\'m listening! Go on..</span></div>';
			} // id가 message-section인 곳에서 message CSS 클래스를 적용하고 id가 bot인 서브레이아웃에서 id가 bot-response인 span 요소로 초기 응답 작성

			function send(message) {
				// * send 함수 정의(내용 이해안됨??)
				var userInput = document.getElementById('user-input');
				// 입력은 id가 user-input인 요소를 가져옴
				userInput.value = message; // value 속성은 send 함수의 매개변수
				var sendButton = document.querySelector('.send[type="submit"]');
				// 제출 버튼을 변수로 저장
				sendButton.click(); // 버튼을 클릭 처리
			}
		</script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js"></script>
		<!--외부 자바스크립트 코드 연결-->
		<script src="script.js"></script>
		<!--script.js 파일 연결-->
	</body>
</html>
